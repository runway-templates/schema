# violation: resources.cpu and resources.memory must use Kubernetes-style
# units. "half" and "256megs" don't match the patterns.
apiVersion: schema.runway.horse/templates/v1alpha1
kind: Template

metadata:
  name: demo
  version: 1.0.0
  displayName: Demo
  description: A demo template.
  category: other

services:
  - name: web
    image: nginx:1.27
    resources:
      cpu: half
      memory: 256megs
