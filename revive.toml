# Runway template schema revive config.

severity = "error"
confidence = 0.8
errorCode = 1
warningCode = 1
enableAllRules = true

[rule.add-constant]
  Disabled = true
[rule.banned-characters]
  Disabled = true
[rule.file-header]
  Disabled = true
[rule.max-public-structs]
  Disabled = true
[rule.package-directory-mismatch]
  Disabled = true
[rule.line-length-limit]
  Arguments = [120]
[rule.argument-limit]
  Arguments = [4]
[rule.function-result-limit]
  Arguments = [3]
[rule.cognitive-complexity]
  Arguments = [15]
[rule.cyclomatic]
  Arguments = [12]
[rule.function-length]
  Arguments = [50, 0]
[rule.max-control-nesting]
  Arguments = [4]
[rule.file-length-limit]
  Arguments = [{ max = 500, skipComments = true, skipBlankLines = true }]
[rule.unhandled-error]
  Arguments = ["fmt.Printf", "fmt.Println", "fmt.Fprintf", "fmt.Fprintln", "fmt.Fprint"]
[rule.comment-spacings]
  Arguments = ["nolint"]
